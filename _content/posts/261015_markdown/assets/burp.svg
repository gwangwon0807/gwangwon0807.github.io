<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Menlo, Consolas, monospace" font-size="19">
  <rect width="1000" height="480" rx="12" fill="#f4f6f8"/>
  <rect width="1000" height="44" rx="12" fill="#e2e8ec"/><rect y="30" width="1000" height="14" fill="#e2e8ec"/>
  <text x="24" y="29" font-family="system-ui, sans-serif" font-size="16" fill="#3a4750" font-weight="600">Repeater</text>
  <text x="130" y="29" font-family="system-ui, sans-serif" font-size="16" fill="#8794a0">Request</text>
  <text x="530" y="29" font-family="system-ui, sans-serif" font-size="16" fill="#8794a0">Response</text>
  <line x1="500" y1="44" x2="500" y2="480" stroke="#d3dbe1" stroke-width="2"/>
  <text x="24" y="90" fill="#1f6f80" font-weight="700">POST <tspan fill="#24292f" font-weight="400">/api/order HTTP/1.1</tspan></text>
  <text x="24" y="122" fill="#57606a">Host: shop.example.com</text>
  <text x="24" y="154" fill="#57606a">Cookie: session=<tspan fill="#24292f">██████████</tspan></text>
  <text x="24" y="186" fill="#57606a">Content-Type: application/json</text>
  <text x="24" y="240" fill="#24292f">{"item_id": 31,</text>
  <rect x="38" y="252" width="190" height="32" rx="4" fill="#ffe3e3"/>
  <text x="44" y="275" fill="#c62828" font-weight="700"> "price": 1}</text>
  <text x="524" y="90" fill="#1a7f37" font-weight="700">HTTP/1.1 200 OK</text>
  <text x="524" y="122" fill="#57606a">Content-Type: application/json</text>
  <text x="524" y="176" fill="#24292f">{"order_id": 8812,</text>
  <text x="524" y="208" fill="#24292f"> "status": "paid",</text>
  <rect x="534" y="220" width="190" height="32" rx="4" fill="#ffe3e3"/>
  <text x="540" y="243" fill="#c62828" font-weight="700"> "charged": 1}</text>
</svg>
